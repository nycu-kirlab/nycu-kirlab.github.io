{{ define "main" }}
<article class="news-announcement container">
  <header class="news-announcement-header">
    <time class="news-announcement-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
    <h1>Our paper “<strong>{{ .Title }}</strong>” has been released on <a href="{{ .Params.paper_url }}">arXiv</a>.</h1>
  </header>
  <div class="news-announcement-content">
    {{ with .Resources.GetMatch .Params.announcement_image }}
    <figure class="news-announcement-figure">
      <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="{{ $.Params.announcement_image_alt }}">
    </figure>
    {{ end }}
    <div class="news-announcement-details">
      <div class="article-style">{{ .Content }}</div>
      {{ with .GetTerms "tags" }}
      <nav class="news-keywords" aria-label="Keywords">
        {{ range . }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
      </nav>
      {{ end }}
    </div>
  </div>
</article>
{{ end }}
