{{ $item := .item }}
<div class="news-item">
  <time class="news-date" datetime="{{ $item.Date.Format "2006-01-02" }}">{{ $item.Date.Format "Jan 02, 2006" }}</time>
  <div class="news-text">
    {{ if eq $item.Layout "announcement" }}
      Our paper “<a href="{{ $item.RelPermalink }}">{{ $item.Title }}</a>” has been released on arXiv.
    {{ else }}
      {{ $item.Params.summary | markdownify }}
    {{ end }}
  </div>
</div>
